<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test of HPlb 1.2.0</title>
    <link rel="stylesheet" href="hplb.css">
</head>
<body>
    <!--danger-card-->
    <danger-card>Danger card content</danger-card>
    <!--info-card-->
    <info-card>Info card content</info-card>
    <!--custom-card-->
    <custom-card name="Custom card" bg-cl="lightgreen" cl-cl="green">Custom card content</custom-card>
    <!--.btn-->
    <hr>
    <button class="btn">Test button with the .btn class</button><br><br>
    <button class="btn btn-big">Test button with the .btn-big class</button><br><br>
    <button class="btn btn-accept">Test button with the .btn-accept class</button><br><br>
    <button class="btn btn-big btn-accept">Test button with the .btn-accept and .btn-big classes</button><br><br>
    <button class="btn btn-delete">Test button with the .btn-delete class</button><br><br>
    <button class="btn btn-big btn-delete">Test button with the .btn-delete and .btn-big classes</button>
    <hr>
    <!--.inp-->
    <input type="text" class="inp" value="Test text input with the .inp class"><br><br>
    <input type="password" class="inp" value="Test password input with the .inp class">
    <script src="hplb.js"></script>
    <hr>
    <!--Text-->
    <p class="txt-center">Paragraph with the .txt-center class</p>
    <h1 class="header">H1 with the .header class</h1>
    <hr>
    <!--colors-->
    <div class="bg-rainbow" style="width: 100px; height: 100px; border-radius: 5px;">Div with the .bg-rainbow class</div>
    <p class="txt-rainbow">Paragraph with the .txt-rainbow class</p>
    <h1 class="txt-rainbow">H1 with the .txt-rainbow class</h1>
</body>
</html>
