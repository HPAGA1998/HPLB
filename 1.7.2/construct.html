<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elements of HPlb 1.7.2</title>
</head>
<body>
    <!--danger-card-->
    <div style="background-color: rgb(255, 97, 97); border-left: 5px solid red; border-radius: 5px; width: max-content; padding-left: 5px; padding-right: 5px; cursor:not-allowed;" class="hover">
        <h3>${this.getAttribute("title")}</h3>
        <h5>${content}</h5>
    </div>
    <!--info-card-->
    <div style="background-color: rgb(207, 226, 232); border-left: 5px solid lightblue; border-radius: 5px; width: max-content; padding-left: 5px; padding-right: 5px; cursor:help;" class="hover">
        <h3>${this.getAttribute("title")}</h3>
        <h5>${content}</h5>
    </div>
    <!--custom-card-->
    <div style="background-color: ${this.getAttribute("bg-cl")}; border-left: 5px solid ${this.getAttribute("cl-cl")}; border-radius: 5px; width: max-content; padding-left: 5px; padding-right: 5px; cursor:help;" class="hover">
        <h3>${this.getAttribute("title")}</h3>
        <h5>${content}</h5>
    </div>
</body>
</html>
